<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro & Café - Menú</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
        }
        
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #1a1a1a;
            color: #c9a961;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #c9a961;
            z-index: 10;
        }
        
        .header h1 {
            margin: 0;
            font-size: 1.8em;
            letter-spacing: 2px;
        }
        
        .header p {
            margin: 5px 0 0 0;
            font-size: 0.9em;
        }
        
        .controls {
            background: #2a2a2a;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            border-bottom: 1px solid #c9a961;
        }
        
        button {
            background: #c9a961;
            color: #1a1a1a;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
        }
        
        button:hover {
            background: #e0b070;
        }
        
        .page-info {
            color: #c9a961;
            font-size: 0.9em;
        }
        
        .pdf-container {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        
        #pdfCanvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BISTRO & CAFÉ</h1>
            <p>— Menú —</p>
        </div>
        
        <div class="controls">
            <button onclick="prevPage()">← Anterior</button>
            <span class="page-info">Página <span id="pageNum">1</span> de <span id="pageCount">1</span></span>
            <button onclick="nextPage()">Siguiente →</button>
        </div>
        
        <div class="pdf-container">
            <canvas id="pdfCanvas"></canvas>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        
        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                const canvas = document.getElementById('pdfCanvas');
                const ctx = canvas.getContext('2d');
                const viewport = page.getViewport({scale: window.innerWidth > 768 ? 1.5 : 1});
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                page.render(renderContext).promise.then(function() {
                    pageRendering = false;
                    document.getElementById('pageNum').textContent = num;
                    
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
        }
        
        function nextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            if (pageRendering) {
                pageNumPending = pageNum;
            } else {
                renderPage(pageNum);
            }
        }
        
        function prevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            if (pageRendering) {
                pageNumPending = pageNum;
            } else {
                renderPage(pageNum);
            }
        }
        
        // Cargar el PDF
        pdfjsLib.getDocument('menu.pdf').promise.then(function(pdf) {
            pdfDoc = pdf;
            document.getElementById('pageCount').textContent = pdf.numPages;
            renderPage(pageNum);
        }).catch(function(error) {
            console.error('Error al cargar el PDF:', error);
            alert('No se pudo cargar el menú. Verifica que el archivo menu.pdf esté en la misma carpeta.');
        });
        
        // Adaptarse al cambio de tamaño
        window.addEventListener('resize', function() {
            if (pdfDoc) renderPage(pageNum);
        });
    </script>
</body>
</html>
