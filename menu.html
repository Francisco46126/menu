<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro & Café - Menú</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
        }
        
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #1a1a1a;
            color: #c9a961;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #c9a961;
        }
        
        .header h1 {
            margin: 0;
            font-size: 1.8em;
            letter-spacing: 2px;
        }
        
        .pdf-container {
            flex: 1;
            overflow: hidden;
        }
        
        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BISTRO & CAFÉ</h1>
            <p style="margin: 5px 0 0 0;">— Menú —</p>
        </div>
        <div class="pdf-container">
            <iframe src="menu.pdf" type="application/pdf"></iframe>
        </div>
    </div>
</body>
</html>
