<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro & Café - Menú</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
        }
        
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #1a1a1a;
            color: #c9a961;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #c9a961;
            z-index: 10;
        }
        
        .header-title {
            flex: 1;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 1.8em;
            letter-spacing: 2px;
        }
        
        .header p {
            margin: 5px 0 0 0;
            font-size: 0.9em;
        }
        
        .btn-volver {
            background: #c9a961;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
            font-size: 0.95em;
        }
        
        .btn-volver:hover {
            background: #e0b070;
        }
        
        .menu-container {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        
        .menu-container img {
            max-width: 100%;
            height: auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="width: 100px;"></div>
            <div class="header-title">
                <h1>BISTRO & CAFÉ</h1>
                <p>— Menú —</p>
            </div>
            <button class="btn-volver" onclick="volverAtras()">← Volver</button>
        </div>
        
        <div class="menu-container">
            <img src="fotomenu.png" alt="Menú">
        </div>
    </div>

    <script>
        function volverAtras() {
            window.history.back();
        }
    </script>
</body>
</html>
