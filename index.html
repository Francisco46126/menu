<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT!Italy - Café & Ristorante</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .logo {
            display: inline-block;
            border: 2px solid #999;
            padding: 10px 14px;
            margin-bottom: 25px;
            background-color: transparent;
        }

        .logo-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: block;
        }

        /* TÍTULO MENÚ */
        .menu-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 0;
        }

        .line {
            flex: 1;
            height: 1px;
            background-color: #999;
            max-width: 80px;
        }

        .titulo {
            font-size: 28px;
            font-weight: 700;
            color: #d32f2f;
            letter-spacing: 2px;
        }

        /* GRID DE CARTAS */
        .cartas-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .carta-card {
            background-color: #1a1a1a;
            border-radius: 5px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .carta-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(211, 47, 47, 0.3);
        }

        .carta-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .carta-button {
            display: block;
            width: 100%;
            background-color: #7fb850;
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: background-color 0.3s ease;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
        }

        .carta-button:hover {
            background-color: #6fa340;
        }

        /* RESPONSIVE - TABLET Y DESKTOP */
        @media (min-width: 768px) {
            body {
                padding: 40px 20px;
            }

            header {
                margin-bottom: 35px;
                padding: 40px 0;
            }

            .logo {
                padding: 12px 16px;
                margin-bottom: 35px;
            }

            .logo-image {
                width: 100px;
                height: 100px;
            }

            .menu-title {
                gap: 25px;
                margin: 0;
            }

            .line {
                max-width: 120px;
            }

            .titulo {
                font-size: 38px;
            }

            .cartas-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 40px;
                margin-bottom: 40px;
            }

            .carta-image {
                height: 400px;
            }

            .carta-button {
                padding: 20px 30px;
                font-size: 18px;
            }
        }

        @media (min-width: 1024px) {
            .titulo {
                font-size: 48px;
            }

            .cartas-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* EFECTO DE CARGA */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .carta-card {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .carta-card:nth-child(1) { animation-delay: 0.1s; }
        .carta-card:nth-child(2) { animation-delay: 0.2s; }
        .carta-card:nth-child(3) { animation-delay: 0.3s; }
        .carta-card:nth-child(4) { animation-delay: 0.4s; }

        /* FOOTER */
        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-top: 60px;
            padding: 50px 20px;
            border-top: 1px solid #333;
        }

        .footer-logo {
            display: flex;
            justify-content: center;
        }

        .logo-footer {
            border: 2px solid #ccc;
            padding: 18px 20px;
            background-color: rgba(255, 255, 255, 0.05);
            text-align: center;
            border-radius: 3px;
            transition: transform 0.3s ease;
        }

        .logo-image-footer {
            width: 90px;
            height: 90px;
            object-fit: contain;
            display: block;
        }

        .logo-footer:hover {
            transform: scale(1.05);
        }

        .footer-link {
            color: #7cb342;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
            padding-bottom: 5px;
        }

        .footer-link:hover {
            color: #9ccc65;
            border-bottom-color: #7cb342;
        }

        @media (min-width: 768px) {
            .footer {
                padding: 60px 20px;
                gap: 40px;
            }

            .logo-footer {
                padding: 25px 30px;
            }

            .footer-link {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="logo">
                <img src="logo-chef.png" alt="IT!Italy Chef" class="logo-image">
            </div>
        </header>

        <!-- TÍTULO MENÚ -->
        <div class="menu-title">
            <div class="line"></div>
            <div class="titulo">MENÚ</div>
            <div class="line"></div>
        </div>

        <div style="margin-bottom: 40px;"></div>

        <!-- CARTAS -->
        <div class="cartas-grid">
            <!-- CARTA 1 -->
            <div class="carta-card">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&h=400&fit=crop" alt="Café Carta" class="carta-image">
                <a href="menu.pdf" target="_blank" class="carta-button">Café Carta</a>
            </div>

            <!-- CARTA 2 -->
            <div class="carta-card">
                <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500&h=400&fit=crop" alt="Cócteles de Carta" class="carta-image">
                <a href="menu.pdf" target="_blank" class="carta-button">Cócteles de Carta</a>
            </div>

            <!-- CARTA 3 -->
            <div class="carta-card">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&h=400&fit=crop" alt="Menús" class="carta-image">
                <a href="menu.pdf" target="_blank" class="carta-button">Menús</a>
            </div>

            <!-- CARTA 4 -->
            <div class="carta-card">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&h=400&fit=crop" alt="Carta Ristorante" class="carta-image">
                <a href="menu.pdf" target="_blank" class="carta-button">Carta Ristorante</a>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="footer-logo">
                <div class="logo-footer">
                    <img src="logo-chef.png" alt="IT!Italy" class="logo-image-footer">
                </div>
            </div>
            <a href="https://nuevocentro.ititaly.com.ar/" target="_blank" class="footer-link">
                Visita nuestra página web principal
            </a>
        </footer>
    </div>

    <script>
        // Los botones ahora son enlaces que abren el PDF directamente
    </script>
</body>
</html>
